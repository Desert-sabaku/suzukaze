[project]
name = "gesture-integration-fixture"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["protobuf==6.33.5", "websockets==17.1"]

[dependency-groups]
dev = ["ruff==0.15.7"]

# Isolated transport-only environment: uv sync --project tools/gesture-integration
# Then install the real packages without their camera/model/UI dependencies:
# uv pip install --python <fixture-python> --no-deps -e gesture_protocol \
#   -e gesture_detection -e unity_bridge
# No PYTHONPATH tricks or imports through a src pseudo-package are used.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
