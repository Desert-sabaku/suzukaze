[project]
name = "unity-bridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "pyserial>=3.5",
    "websockets>=17.1",
]

[project.scripts]
unity-bridge = "unity_bridge.core:main"
unity-gesture-probe = "unity_bridge.gesture_probe:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pyright>=1.1",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["../gesture_detection/src"]

[tool.pyright]
extraPaths = ["src", "../gesture_detection/src"]
venvPath = "."
venv = ".venv"
