syntax = "proto3";

package fan.v1;

option csharp_namespace = "Suzukaze.Fan.Protocol";

enum FanChannel {
  FAN_CHANNEL_UNSPECIFIED = 0;
  FAN_CHANNEL_LEFT_BACK = 1;
  FAN_CHANNEL_LEFT_SIDE = 2;
  FAN_CHANNEL_LEFT_FRONT = 3;
  FAN_CHANNEL_RIGHT_BACK = 4;
  FAN_CHANNEL_RIGHT_SIDE = 5;
  FAN_CHANNEL_RIGHT_FRONT = 6;
}

message Fan {
  FanChannel channel = 1;

  // 0-255
  uint32 value = 2;

  uint64 duration_ms = 3;
}
