syntax = "proto3";

package micon.v1;

import "micon/v1/gpio.proto";
import "micon/v1/heartbeat.proto";
import "micon/v1/log.proto";
import "micon/v1/pwm.proto";

option go_package = "firmware/gen/micon/v1;micon_v1";

message Packet {
  oneof payload {
    LogEntry log_entry = 1;
    HandshakeReq handshake_req = 2;
    HandshakeResp handshake_resp = 3;
    Heartbeat heartbeat = 4;
    PwmFade pwm_fade = 5;
    GpioPulse gpio_pulse = 6;
  }
}
