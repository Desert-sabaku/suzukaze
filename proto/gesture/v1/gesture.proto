syntax = "proto3";

package gesture.v1;

option csharp_namespace = "Suzukaze.Gesture.Protocol";

message GestureEnvelope {
  uint32 version = 1;
  string session_id = 2;
  oneof payload {
    State state = 10;
    Event event = 11;
    Ack ack = 12;
  }
}

message State {
  uint64 sequence = 1;
  double sent_at = 2;
  double stale_timeout = 3;
  bool fresh = 4;
  ContinuousGesture gesture = 5;
  bool tracking = 6;
  optional double observed_at = 7;
  optional uint64 frame_id = 8;
  optional double source_timestamp = 9;
  // Execution quality of this gesture, not recognition confidence.
  // Finite score in [0, 1]: 0 = no conformity, 1 = full conformity to the
  // gesture-specific motion criteria. Absence means not evaluated.
  // Applies to this observation; omit for NONE or unavailable tracking.
  optional double action_accuracy = 10;
  // Current detector progress, independent of continuous gesture and events.
  // Both fields are present together, only while fresh and tracking.
  // phase_action: RAMUNE, UCHIMIZU, FANNING, RELAXING or BOW.
  // Only the following action/phase pairs are valid:
  // RAMUNE = FORMING/READY/OPENED/WAIT_RELEASE,
  // UCHIMIZU = READY/SWING, FANNING/RELAXING = ACTIVE, BOW = HOLD.
  // Receivers reject unknown or mismatched pairs, including NONE/IDLE phases.
  // Adding a phase requires updating sender and receiver validation together.
  // This is a latest-value snapshot: intermediate phases may be skipped,
  // and camera arbitration may move progress backwards. Even OPENED/SWING
  // does not guarantee an accepted occurrence; use Event for completion.
  // Absence means no active phase (including idle or unavailable tracking).
  optional string phase_action = 11;
  optional string phase = 12;
}

message Event {
  uint64 event_id = 1;
  OccurrenceGesture gesture = 2;
  double occurred_at = 3;
  double expires_at = 4;
  optional uint64 frame_id = 5;
  optional double source_timestamp = 6;
  // Execution quality of this occurrence using gesture-specific motion
  // criteria. Same finite [0, 1] scale as State.action_accuracy; absence
  // means not evaluated. Retries of an event retain the original score.
  optional double action_accuracy = 7;
}

message Ack {
  uint64 event_id = 1;
  AckStatus status = 2;
}

enum ContinuousGesture {
  CONTINUOUS_GESTURE_UNSPECIFIED = 0;
  CONTINUOUS_GESTURE_NONE = 1;
  CONTINUOUS_GESTURE_FANNING = 2;
  CONTINUOUS_GESTURE_RELAXING = 3;
  CONTINUOUS_GESTURE_BOW = 4;
}

enum OccurrenceGesture {
  OCCURRENCE_GESTURE_UNSPECIFIED = 0;
  OCCURRENCE_GESTURE_RAMUNE = 1;
  OCCURRENCE_GESTURE_UCHIMIZU = 2;
}

enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  ACK_STATUS_ACCEPTED = 1;
  ACK_STATUS_IGNORED = 2;
  ACK_STATUS_EXPIRED = 3;
  ACK_STATUS_DUPLICATE = 4;
}
