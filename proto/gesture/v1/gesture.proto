syntax = "proto3";

package gesture.v1;

option csharp_namespace = "Suzukaze.Gesture.Protocol";

message GestureEnvelope {
  uint32 version = 1;
  string session_id = 2;
  oneof payload {
    State state = 10;
    Event event = 11;
    Ack ack = 12;
  }
}

message State {
  uint64 sequence = 1;
  double sent_at = 2;
  double stale_timeout = 3;
  bool fresh = 4;
  ContinuousGesture gesture = 5;
  bool tracking = 6;
  optional double observed_at = 7;
  optional uint64 frame_id = 8;
  optional double source_timestamp = 9;
  // Motion quality score in [0, 1]. Absent when not evaluated.
  optional double action_accuracy = 10;
  // Current action and phase. Present only while fresh and tracking.
  // This is a latest-value snapshot; use Event for completed actions.
  reserved 11, 12;
  optional Action action = 13;
  optional Phase phase = 14;
  // True when a person is stably present in the booth ROI.
  optional bool booth_present = 15;
}

message Event {
  uint64 event_id = 1;
  OccurrenceGesture gesture = 2;
  double occurred_at = 3;
  double expires_at = 4;
  optional uint64 frame_id = 5;
  optional double source_timestamp = 6;
  // Motion quality score in [0, 1]. Absent when not evaluated.
  optional double action_accuracy = 7;
}

message Ack {
  uint64 event_id = 1;
  AckStatus status = 2;
}

enum ContinuousGesture {
  CONTINUOUS_GESTURE_UNSPECIFIED = 0;
  CONTINUOUS_GESTURE_NONE = 1;
  CONTINUOUS_GESTURE_FANNING = 2;
  CONTINUOUS_GESTURE_RELAXING = 3;
  CONTINUOUS_GESTURE_BOW = 4;
}

enum OccurrenceGesture {
  OCCURRENCE_GESTURE_UNSPECIFIED = 0;
  OCCURRENCE_GESTURE_RAMUNE = 1;
  OCCURRENCE_GESTURE_UCHIMIZU = 2;
}

enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  ACK_STATUS_ACCEPTED = 1;
  ACK_STATUS_IGNORED = 2;
  ACK_STATUS_EXPIRED = 3;
  ACK_STATUS_DUPLICATE = 4;
}

// All motions, including NONE used by recognition before an action is selected.
// State.action must not be NONE or UNSPECIFIED; omit action/phase when idle.
enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_NONE = 1;
  ACTION_FANNING = 2;
  ACTION_RELAXING = 3;
  ACTION_BOW = 4;
  ACTION_RAMUNE = 5;
  ACTION_UCHIMIZU = 6;
}

// IDLE is an internal detector state, never a delivered State.phase.
enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_IDLE = 1;
  PHASE_FORMING = 2;
  PHASE_READY = 3;
  PHASE_OPENED = 4;
  PHASE_WAIT_RELEASE = 5;
  PHASE_SWING = 6;
  PHASE_ACTIVE = 7;
  PHASE_HOLD = 8;
  // Annotation-only stages; not valid in delivered State.phase yet.
  PHASE_POSITION = 9;
  PHASE_DWELL = 10;
  PHASE_BENDING = 11;
  PHASE_RETURNING = 12;
}
