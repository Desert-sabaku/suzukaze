name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  unity-bridge:
    name: Unity bridge (lint, types, protocol tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unity_bridge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true
      - name: Generate protobuf bindings
        working-directory: proto
        run: buf generate
      - name: Install dependencies
        run: uv sync --group dev
      - name: Format and lint
        run: |
          uv run ruff format --check src test
          uv run ruff check src test
      - name: Type-check
        run: uv run pyright
      - name: Test gesture delivery
        run: uv run python -m pytest

  ruff:
    name: Ruff (format + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gesture_detection
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Format check
        run: uv run ruff format --check src tests scripts main.py
      - name: Lint
        run: uv run ruff check src tests scripts main.py

  pyright:
    name: Pyright (type checking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gesture_detection
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Type-check
        run: uv run pyright

  pytest:
    name: Pytest (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gesture_detection
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run python -m pytest
