name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  difference-detection:
    name: Difference Detection
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      bridge: ${{ steps.filter.outputs.bridge }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - "gesture_detection/**"
              - "mcu/**"
              - "pyproject.toml"
              - "uv.lock"
            bridge:
              - "unity_bridge/**"
              - "proto/**"
              - "pyproject.toml"
              - "uv.lock"

  python-checkers:
    needs: difference-detection
    if: ${{ needs.difference-detection.outputs.python == 'true' }}
    name: Python Checkers (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gesture_detection
    steps:
      - uses: actions/checkout@v4
      - name: install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Format check
        run: uv run ruff format --check src tests scripts main.py
      - name: Lint
        run: uv run ruff check src tests scripts main.py
      - name: Type-check
        run: uv run pyright
      - name: Test
        run: uv run pytest

  unity-bridge:
    needs: difference-detection
    if: ${{ needs.difference-detection.outputs.bridge == 'true' }}
    name: Unity bridge (lint, types, protocol tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unity_bridge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true
      - name: Generate protobuf bindings
        working-directory: proto
        run: buf generate
      - name: Install dependencies
        run: uv sync --group dev
      - name: Format and lint
        run: |
          uv run ruff format --check src test
          uv run ruff check src test
      - name: Type-check
        run: uv run pyright
      - name: Test gesture delivery
        run: uv run python -m pytest
