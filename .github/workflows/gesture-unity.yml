name: Gesture Unity receiver

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-receiver:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore checksum-pinned Unity DLLs without fetching project LFS assets
        run: python tools/restore_unity_protobuf.py
      - name: Restore locked portable test dependencies
        run: dotnet restore tools/GestureDelivery.Smoke/GestureDelivery.Smoke.csproj --locked-mode
      - name: Test native host clocks, policy, sockets, and schema-owned golden fixtures
        run: dotnet test tools/GestureDelivery.Smoke/GestureDelivery.Smoke.csproj --no-restore --verbosity minimal
      - name: Build C# 8 and .NET Standard 2.1 compatibility target
        run: dotnet build tools/GestureDelivery.Compatibility/GestureDelivery.Compatibility.csproj --verbosity minimal
