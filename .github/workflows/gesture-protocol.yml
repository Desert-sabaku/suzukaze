name: Gesture protocol

on:
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gesture_protocol
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Verify generated bindings
        run: |
          uv run --locked python scripts/generate.py
          git diff --exit-code -- src/suzukaze_gesture_protocol/generated ../suzukaze/Assets/GestureDelivery/Generated/Gesture.cs
      - run: uv run --locked pytest
      - run: uv build --wheel
