[project]
dependencies = [
  "mediapipe>=0.10.35",
  "numpy>=2.5.1",
  "opencv-python>=5.0.0.93",
  "python-dotenv>=1.2.3",
  "ultralytics>=8.4.121",
]
description = "カメラまたは動画を MediaPipe Pose で解析し、「扇ぎ」「打ち水」「夕涼み」 「ラムネ開栓」の4動作を判定するアプリケーション"
name = "gesture-detection"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[project.scripts]
gesture-detection = "modules.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["modules"]

[dependency-groups]
dev = [
  "pyright>=1.1",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.13.0",
]

[tool.ruff]
line-length = 100
src = ["modules", "tests", "main.py"]
target-version = "py312"

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --cov=modules --cov-report=term-missing"

[tool.pyright]
include = ["modules", "tests", "main.py"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
extraPaths = ["modules"]
venvPath = "."
venv = ".venv"
